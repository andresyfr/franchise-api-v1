rootProject.name = 'franchise-backend'

// Self-discovery: every folder with build.gradle is a service.
// To add a new service it is enough to create backend/<name>/build.gradle.
def excluded = ['gradle', 'buildSrc', 'build', '.gradle']

rootDir.eachDir { dir ->
    if (!excluded.contains(dir.name) && new File(dir, 'build.gradle').exists()) {
        include dir.name
    }
}
