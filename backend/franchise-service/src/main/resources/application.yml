server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

spring:
  application:
    name: franchise-api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  reactor:
    # Propagates traceId/spanId (MDC) across Reactor operators
    context-propagation: auto
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/franchisedb}
      auto-index-creation: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

info:
  application:
    name: ${spring.application.name}
    description: Reactive API for managing franchises, branches and product stock
    version: 1.0.0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: always
  info:
    env:
      enabled: true
    java:
      enabled: true
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
    metrics:
      export:
        enabled: ${OTLP_EXPORT_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: 30s

logging:
  level:
    root: INFO
    com.andresyfr.franchise: ${APP_LOG_LEVEL:INFO}
