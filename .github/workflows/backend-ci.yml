name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test all services
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: backend/*/build/reports

  docker:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [franchise-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f backend/${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:ci backend
